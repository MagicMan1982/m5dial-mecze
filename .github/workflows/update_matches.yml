  name: Update Match Schedule from Web

  'on':
    schedule:
       - cron: '0 6   *'
    workflow_dispatch:

  jobs:
    update:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
         - name: Checkout repo
          uses: actions/checkout@v4

         - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

         - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install requests beautifulsoup4

         - name: Run web scraper script
          run: python update_matches.py

         - name: Commit and push if changed
          uses: stefanzweifel/git-auto-commit-action@v5
          with:
            commit_message: "Automatyczna aktualizacja terminarza z sieci"
            file_pattern: matches.json
